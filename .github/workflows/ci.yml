name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compose-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -p outscan-ci-baseline -f deploy/compose/compose.yaml --profile baseline config --quiet
      - run: docker compose -p outscan-ci-baseline -f deploy/compose/compose.yaml --profile baseline build
      - run: docker compose -p outscan-ci-baseline -f deploy/compose/compose.yaml --profile baseline up -d --wait --wait-timeout 90
      - run: docker compose -p outscan-ci-baseline -f deploy/compose/compose.yaml --profile baseline exec -T api-baseline node container-smoke.mjs
      - run: docker compose -p outscan-ci-baseline -f deploy/compose/compose.yaml --profile scanner-check run --build --rm -T scanner-offline-check
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: docker compose -p outscan-lifecycle-check -f deploy/compose/compose.yaml --profile scanner-check build scanner-offline-check
      - run: node scripts/verify-scanner-lifecycle.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @outscan/api build
      - run: node scripts/verify-offline-launcher.mjs
      - if: always()
        run: docker compose -p outscan-ci-baseline -f deploy/compose/compose.yaml --profile baseline --profile scanner-check down
      - if: always()
        run: docker compose -p outscan-lifecycle-check -f deploy/compose/compose.yaml --profile scanner-check down
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: outscan_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d outscan_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      OUTSCAN_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/outscan_test
      OUTSCAN_TEST_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: node --test scripts/ubuntu-host-policy.test.mjs
      - run: python3 -m unittest discover -s scripts/b1_harness/tests -v
      - run: python3 -m unittest discover -s scripts/b1_image/tests -v
      - run: pnpm exec eslint "deploy/b1-harness/fixture/*.mjs"
      - run: pnpm exec eslint scripts/ubuntu-host-policy.mjs scripts/ubuntu-host-policy.test.mjs scripts/verify-ubuntu-host.mjs
      - run: pnpm exec eslint "deploy/compose/*.mjs"
      - run: pnpm exec eslint scripts/verify-scanner-lifecycle.mjs scripts/scanner-pressure-probes.mjs
      - run: pnpm exec eslint scripts/verify-offline-launcher.mjs
      - run: pnpm verify:db
      - run: pnpm verify:queue
